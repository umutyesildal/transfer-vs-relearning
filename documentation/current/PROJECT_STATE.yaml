historical_next_decision_record_2026_08_22:
  subject: prepare_m1_execution_input_packet
  note: >-
    Pile-10k is retired prospectively and no retry is required. The three-model M0 exact-prefix
    panel is complete and the 21 required non-Pile lanes already exist. The v1b reference
    projection now contains 24 hash-verified source rows and zero metric rows. The v1b read-only
    audit traversed all 24 bindings and stopped with 3/42 observations because
    canonical metrics use path-specific lm-eval/project schemas and factual robust evidence is in
    declared CSVs. The append-only result is preserved. The authorized path-aware v1c audit now
    passes with 24/24 source rows and 42/42 metric observations, with no source mutation and no
    output-root creation. v1d/v1e failures are preserved append-only. The authorized v1f
    correction now passes with 24/24 source rows and 42/42 observations, writes the five tracked
    canonical artifacts under the fresh v1f root, and leaves all historical sources unchanged.
    M0 normalization is complete pending interpretation. The non-executable preparation plan is
    documentation/decisions/M1_CONTRACT_PREPARATION_PLAN_2026-08-22.md with SHA-256
    d3dea09be3900932f686438edecd7421a96c67133774979f95bc82e07fc22984. The current global gate
    remains blocked_by_measurement_design, with benchmark-registry and source-model-provenance
    contributors. The read-only blocker-resolution packet is
    documentation/decisions/M1_BLOCKER_RESOLUTION_PACKET_2026-08-22.md (SHA-256
    93631f133b3d2df8eefb1d19cb3e95a4c2e0b03d0ab0ac95e07e08182c352c96); it closes no gate and
    creates no executable contract. The follow-up local audit is
    documentation/decisions/M1_READ_ONLY_EVIDENCE_AUDIT_2026-08-22.md (SHA-256
    653a15a88897eb8d3e02da2a0ee794326f73e284744568e2abcb1bcc7eb32e81); eval-v2 protocol identity
    passed, but benchmark registry, source provenance, measurement design and primary corpus
    remain blocked. Prepare only the evidence-resolution boundary before any executable M1
    contract. The TurBLiMP identity reconciliation memo is
    documentation/decisions/M1_BENCHMARK_IDENTITY_RECONCILIATION_2026-08-22.md (SHA-256
    b2c4a60f15634678bfa05765aea2ebf5ae784947e1ae1c93814016e071758702); it preserves the M0
    `juletxara` route and the separate 151ab `ezgibasar` candidate without changing eval-v2.
    The model provenance reconciliation memo is
    documentation/decisions/M1_MODEL_PROVENANCE_RECONCILIATION_2026-08-22.md (SHA-256
    ca056a5f4d837ab9c0767744f81bcb1a993a440219c94fc8ca6076298eb49f28); historical model results
    remain preserved, but new M1 artifact/tokenizer manifests are still required.
    The pre-contract measurement review ledger is
    documentation/decisions/M1_MEASUREMENT_REVIEW_LEDGER_DRAFT_2026-08-22.md (SHA-256
    6fe0b3291966d733698c548b5622fea54c2bd9374848298d1b919838e36e6696); it leaves all five 151ab
    review fields explicit and unresolved.
    The primary Turkish corpus decision memo is
    documentation/decisions/M1_PRIMARY_TURKISH_CORPUS_DECISION_MEMO_2026-08-22.md (SHA-256
    89acc2e9c4a80b22d685cfd696edb176150e92123a06723bc8f7b14a53f026e0); vngrs remains conditional
    for the later M2 sibling arms, trwiki remains control-only, and no corpus is selected or
    materialized. The current user correction binds M1 to synthetic English facts and reserves
    vngrs for M2-A/M2-B; the append-only correction record is
    documentation/decisions/M1_DESIGN_REALIGNMENT_VNGRS_TO_M2_2026-08-22.md. The earlier
    M1-primary memo remains preserved as superseded evidence.
    User-confirmed M1 design decisions now bind the M0/eval-v2 TurBLiMP route and all active M0
    eval-v2 metrics; the historical decision record is
    documentation/decisions/M1_DESIGN_DECISIONS_CONFIRMED_2026-08-22.md (SHA-256
    19685a3eb1c657e11b23cd8fbfab3490ebda5a95eb34b1b25968b042a20d3d64). Operational corpus
    evidence, materialization, M1 contract and training remain blocked. The M1 execution packet
    now requires the synthetic-fact dataset manifest, not a vngrs manifest; vngrs is a later M2
    contract input. The local read-only synthetic-fact input audit is
    documentation/decisions/M1_SYNTHETIC_FACT_DATASET_INPUT_AUDIT_2026-08-22.md (SHA-256
    72ede18543245a7e44c2545ffee16ab8cc796f0127b057e7f8d520e64fddb4fc); it confirms the tracked
    100-subject/500-fact/3,500-row M1 release and changes no readiness gate.
    The fixed three-model clarification is
