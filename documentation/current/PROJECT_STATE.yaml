    path rather than invent a trainer.
    Max feedback is now a mandatory traceability invariant; the run-recording protocol is
    documentation/decisions/MAX_FEEDBACK_AND_RUN_RECORDING_PROTOCOL_2026-08-22.md (SHA-256
    9a2c3e84d274ccb1efb2c4710a930670e94a49a987a01d9244e5fefbba22eee3). It binds epoch-level
    factual/retention rows, hyperparameters, immutable snapshots, raw hashes and generated
    presentation views without opening execution. The deterministic builder is
    `src/transfer_vs_relearning/pipeline/presentation.py` with the thin entrypoint
    `scripts/study/build_presentation_bundle.py`; it writes only derived presentation outputs.
    M1 inventory/evaluation, M1/M2 training and cleanup remain separately controlled.
