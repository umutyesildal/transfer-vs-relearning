next_decision_required:
  subject: implement_and_freeze_bounded_m2_parent_fact_registry_and_block_materialization_preparation
  decision_owner: user
  start_m1_now: false
  note: >-
    M0 and the matched three-model M1 training/eval-v2 family are complete. The user selected
    OLMo, Qwen and SmolLM as mandatory M2-A/M2-B training models, with no single primary model.
    The six-file manifest-only tokenizer inventory completed PASS with zero HU writes, closing all
    three tokenizer asset registries. The first registry/storage discovery pass stopped at
    HU-incompatible inode syntax. Its corrected retry closed filesystem observations but generic
    command-output capture truncated the emitted ledger before local extraction. The direct-pipe
    pass then separated Parquet compressed bytes from full-object bytes, and the authorized repair
    closed 32/32 LFS identities with canonical registry SHA
    `b1c80bf78ff40de5c02e14f08082a51cc17cc90a9853028eaf866cb63326e41f`.
    All passes had zero HU writes and no corpus/object downloads. Storage arithmetic is now closed
    at a 32 GiB frozen peak with 40 GiB/1,024-inode fresh-preflight requirements. The local staged
    operator, exact Parquet loader, reviewed HTTPS/tokenizer adapters, atomic evidence chain and
    typed-failure behavior passed 191 compatible tests. The pre-correction Phase-1 route was
    stopped before Slurm submission because external preflight/log writes contradicted the sole
    root. Corrected V1A kept preflight in memory and Slurm logs off filesystem, but its single job
    `481608` stopped before root creation or network access when the exact HU-home `du` exceeded
    its 120-second timeout. The V1A authorization is consumed. Frozen V1B changes only that
    timeout to 300 seconds and added bounded best-effort Slurm-comment status evidence. Its one
    job `481711` started on `gruenau4` but disappeared before root creation; the comment was lost
    after controller purge and `sacct` remained unavailable. V1B is operational `NOT_RUN` and its
    authorization is consumed. V1C then persisted the exact `481836` exception and proved the
    accepted root still has 104 files / 18,025,945 bytes; historical line serialization still
    reproduces `120cdd7b...`, while the V1 canonical-JSON validator produced `268ebe81...`.
    V1C is operational `NOT_RUN` with zero network/object writes and its root is preserved.
    D0 v2 corrected the inventory serialization and its authorized job `481838` downloaded the
    first exact 448,718,347-byte Parquet object, but stopped before publication because the prior
    registry repair misclassified transport object ID `a81097...` as the full-byte SHA. The
    preserved partial's computed SHA is `d72ae7...`; its Parquet magic and accepted footer/trailer
    all match. Frozen D0 v3 keeps object ID and computed byte SHA separate, re-downloads rather
    than reusing V2, requires first-object cross-wave calibration, atomically records computed
    byte hashes and revalidates them before Parquet row loading. The exact V3 wave was authorized,
    commit `b7af152139e4a50c323830474a8e862d91291a2b` was pushed and preservation-checked
    fast-forwarded on HU, and job `481844` materialized all 32 objects / 9,502,315,428 bytes with
    manifest SHA `bb413e9a...`. It then stopped fail-closed at the mandatory lightweight audit.
    Terminal failure SHA is `a341e478...`; no split or review packet was created. The V3 code did
    not persist the audit detail before raising, so the exact contamination/encoding trigger is
    unresolved. Document 181 records the result. The user has prospectively selected only cleaned
    OSCAR-2201-derived rows for the main M2 training population; mC4 remains preserved and
    training-excluded. The first audit-recovery job `481863` read V3 in place and preserved the
    exact labels: `oscar` has 354,482 documents / 1,553,923,133 UTF-8 bytes and `mc4` has
    5,317,204 documents / 14,195,860,459 bytes. It stopped before audit because V1 had frozen
    uppercase `OSCAR`. Document 182 records this case-only mismatch. V1a then completed exact
    lowercase `oscar` selection in job `481886`: 354,482 documents, 439,906 exact atom pairs,
    935,276 normalized atom pairs and zero invalid-encoding documents. Its historical flattened
    gate blocked because ordinary answer/object surfaces were independently blocking; the 256+256
    bounded examples are all `object:*`. Document 183 preserves the result and limits that claim.
    Job `481904` executed the frozen fact-pair contract once and completed PASS over all 354,482
    exact lowercase OSCAR documents: subject-only hits, exact/normalized paired fact hits and
    `U+FFFD` documents were all zero. The three terminal artifacts are hash-closed in Document
    184; `sacct` remained unavailable due Munge/SlurmDBD authentication. The later split and
    review chain closed the exact 344,482/10,000 split and 64/64 usable decision ledger. Phase-2
    V1 job `481910` preserved a single-character historical inventory failure; V1A job `481980`
    then passed the corrected inventory, frozen snapshot-manifest cross-check, all three offline
    tokenizer compatibility gates and all six train/held-out accounting reports. Its terminal
    final-audit SHA is `3f3d19f...`; no model weight, GPU, training or tokenized-corpus persistence
    occurred. Phase-2 evidence is complete, while `ready_to_train=false` remains mandatory until
    the matched three-model M2-A/M2-B training and measurement contract is frozen and separately
    authorized.

