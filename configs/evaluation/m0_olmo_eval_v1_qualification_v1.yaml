    - id: generation_integrity
      adapter: project_generation_integrity
      families: [generation_integrity]
      evaluator_config: configs/evaluation/m0_olmo_qualification_generation_v1.yaml
      evaluator_config_sha256: 040f842e1339e3c7627e0392640adef781b8fb9f58e1abaa603b7844579bf4de
      expected_output_root: /vol/tmp2/yesildau/eval_v1_m0_olmo_qualification_v1/lanes/generation_integrity/raw/general_capability

test_only_policy:
  limited_run_classification: test_only_non_scientific
  limit_may_define_scientific_subset: false
  metrics_may_enter_scientific_tables: false
  normalizer_must_reject_mixed_classifications: true
  exact_limits:
    harness_examples_per_task_or_subtask: 2
    factual_ordered_probes: 8
    generation_prompts: 31
    generic_completion_items: 31

storage:
  proposed_root: /vol/tmp2/yesildau/eval_v1_m0_olmo_qualification_v1
  fresh_root_required: true
  hu_home_read_only: true
  previous_evidence_roots_read_only: true
  atomic_writes_required: true

required_outputs:
  - qualification_manifest.json
  - environment_lock.json
  - model_identity.json
  - task_resolution.jsonl
  - dataset_content_manifest.jsonl
  - runtime_measurements.jsonl
  - parity_results.jsonl
  - raw_artifact_manifest.jsonl
  - qualification_result.json
  - final_inventory.json

allowed_final_gate_values:
  - qualified_for_eval_v1_freeze_review
  - blocked

forbidden_claims:
  - M0_PASS
  - M0_FAIL
  - scientific_m0_score
  - ready_to_train
  - selected_primary_model

freeze_blockers:
  - implementation_commit_and_adapter_hashes
  - exact_environment_lock_sha256
  - final_contract_config_hashes

eval_v1_promotion_blockers:
  - dataset_revisions_and_content_manifests
  - turkishmmlu_inclusion_decision
  - wikitext_and_turblimp_parity_tolerances
  - pile_10k_scientific_cadence
  - final_schema_inventory_and_retention_rules

prohibitions:
  - scientific_evaluation_claims
  - model_download
  - training
  - corpus_materialization
  - cleanup_or_deletion
  - task_data_retrieval_beyond_frozen_cache_bounds
