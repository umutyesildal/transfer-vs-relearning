    inclusion: core
    status: frozen_verified
    role: english_retention_primary
    cadence: dense
    fewshot: 0
    primary_metric: bits_per_byte
    reported_metrics: [word_perplexity, byte_perplexity, bits_per_byte]
    dataset: EleutherAI/wikitext_document_level
    dataset_config: wikitext-2-raw-v1
    split: test
    dataset_revision: 647234772b9554e208af6c826f23b99e3cac88c8
