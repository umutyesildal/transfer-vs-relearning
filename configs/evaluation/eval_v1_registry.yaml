  - id: xcopa_tr
    reason: reserve_secondary_was_not_promoted_before_eval_v1_freeze
  - id: xquad_tr
    reason: generation_format_sensitivity_and_no_incremental_core_estimand
  - id: ewok
    reason: exact_source_and_adapter_unresolved
  - id: turkish_hellaswag
    reason: no_verified_upstream_task_and_machine_translation_is_forbidden

custom_factual:
  evaluator: project_native
  primary_candidate_score: mean_answer_token_log_probability
  sensitivity_candidate_score: total_answer_token_log_probability
  tie_breaker: canonical_object_id
  directions: [en_to_en, tr_to_en, tr_to_tr]
  cells:
    forms: [form_a, form_b, form_c, form_d]
    scaffolds: [direct, qa]
  primary_outcome: top1_accuracy
  robustness:
    - relation_accuracy
    - form_accuracy
    - scaffold_accuracy
    - worst_cell_accuracy
    - robust_fact_intersection
    - same_subject_relation_swap
  uncertainty: paired_subject_bootstrap
  exact_prefix_generation: secondary_where_explicitly_defined
  source_english_audit_registry:
    path: configs/evaluation/registries/eval_v1_factual_full_4000.csv
    sha256: 54bf2968bcffecee8f0438b0ac489a6ab5fd0150dca2c459a4a1ad9efe50796b
    rows: 4000
  full_registry:
    path: configs/evaluation/registries/eval_v1_factual_full_bilingual_12000.csv
    sha256: 5125850a2db24c6b570971a58e9ba8a8586cabdec9084eb0e99bbd639691d93f
    rows: 12000
  cheap_registry:
    path: configs/evaluation/registries/eval_v1_factual_cheap_bilingual_1500.csv
    sha256: 9619339d5d0373036d26d39c88f36976bd4a9248f64ed346241a6ce54e658fc2
    rows: 1500
    denominator: one_probe_per_fact_per_direction

retention:
  english_primary: wikitext_raw_bits_per_byte_and_absolute_delta_to_parent
  english_secondary: pile_10k_raw_bits_per_byte_and_absolute_delta_to_parent
  turkish_primary: frozen_heldout_turkish_raw_bits_per_byte_and_absolute_delta_to_parent
  turkish_cross_domain_control:
    source: trwiki-20260601_validation
    sha256: 15480c1f543acf6df7aac1b2a2ee15fdcb3a544814f0063a181bd7a9cb0ca4f8
    documents: 10034
    role: required_cross_domain_control_not_substitute_for_primary_in_domain
  report_always:
    - raw_value
    - parent_value
    - absolute_delta
    - word_perplexity
    - byte_perplexity
    - perplexity_ratio_to_parent
  bpb_ratio_to_parent:
    role: optional_diagnostic_only
    reason: bits_per_byte_is_already_log_scaled
  derived_retention_score:
    formula: 100 / perplexity_ratio
    role: visualization_only
    scientific_gate: false

scientific_gates:
  comparison_unit: paired_subject
  confidence:
    method: paired_subject_bootstrap
    draws: 10000
    seed: 42
    interval: 0.95
    causal_positive_rule: point_estimate_at_least_minimum_gain_and_two_sided_interval_lower_bound_above_zero
  m1_factual_acquisition:
    en_to_en_exact_prefix_min: 0.90
    en_to_en_trained_forms_a_b_top1_global_min: 0.80
    en_to_en_trained_forms_a_b_top1_each_relation_min: 0.80
    en_to_en_heldout_forms_c_d_top1_global_min: 0.80
    en_to_en_heldout_forms_c_d_top1_each_relation_min: 0.80
    en_to_en_robust_eight_cell_fact_intersection_global_min: 0.70
    en_to_en_robust_eight_cell_fact_intersection_each_relation_min: 0.70
  english_retention:
    wikitext_delta_bpb_max: 0.32192809488736235
    wikitext_equivalent_byte_perplexity_ratio_max: 1.25
    pile_10k_delta_bpb_max: 0.32192809488736235
    pile_10k_equivalent_byte_perplexity_ratio_max: 1.25
    blimp_absolute_accuracy_drop_max: 0.05
    hellaswag_acc_norm_absolute_drop_max: 0.05
    winogender_role: diagnostic_no_gate
  m2_turkish_manipulation:
    primary_in_domain_byte_perplexity_ratio_to_m1_max: 0.95
    primary_in_domain_delta_bpb_max: -0.07400058144377693
    trwiki_control_report_required: true
    turblimp_acc_norm_absolute_drop_max: 0.05
  m2_english_factual_retention:
    en_to_en_top1_absolute_drop_from_m1_max: 0.05
    en_to_en_robust_intersection_absolute_drop_from_m1_max: 0.05
  transfer_m2_a_minus_m1:
    tr_to_en_top1_minimum_gain: 0.05
    bootstrap_interval_lower_bound_strictly_above: 0.0
    already_open_fallback_floor: 0.30
    already_open_fallback_drop_max: 0.05
  relearning_m2_b_minus_m2_a:
    tr_to_en_top1_minimum_gain: 0.05
    bootstrap_interval_lower_bound_strictly_above: 0.0
  replication:
    rule: every_required_seed_must_meet_the_same_point_and_interval_rule
  selection:
    rule: earliest_precommitted_checkpoint_passing_every_required_gate
    outcome_aware_threshold_or_checkpoint_change: forbidden

final_harness_task_ids:
  - wikitext
  - pile_10k
  - blimp
  - hellaswag
  - winogender_female
  - winogender_male
  - winogender_neutral
  - turblimp_core

training_trace:
  required_for_future_runs: true
  cadence: optimizer_logs_plus_every_epoch_end
  epoch_snapshot_policy: model_only_every_epoch
  resumable_checkpoint_policy: separately_precommitted_milestones
  storage_preflight_required: true
  required_tokenization_statistics:
    - total_nonpad_tokens
    - total_supervised_tokens
    - mean_nonpad_tokens
    - p50_nonpad_tokens
    - p95_nonpad_tokens
    - padding_fraction
    - truncation_count
    - truncation_rate
  required_optimization_trace:
    - epoch
    - update
    - cumulative_examples
    - cumulative_fact_exposures
    - cumulative_supervised_tokens
    - cumulative_total_tokens
    - train_loss
    - learning_rate
    - grad_norm
    - checkpoint_sha256

pipeline:
  config_schema: configs/pipelines/eval_v1_olmo_epoch_trajectory_template.yaml
  stage_order:
    - identity_preflight
    - train_and_trace
    - dense_evaluation
    - full_evaluation
    - normalization
    - presentation_bundle
  required_outputs:
    - checkpoint_registry.parquet
    - metric_observations.parquet
    - factual_probe_results.parquet
    - trajectory_wide.csv
    - hyperparameters.csv
    - evaluation_manifest.json
    - presentation/figure_manifest.json

freeze_blockers: []
