schema_version: 1
name: eval-v1
status: draft
as_of: "2026-08-15"
execution_ready: false
execution_authorized: false

design_sources:
  - documentation/177_SUPERVISOR_FEEDBACK_EVALUATION_FIRST_OLMO_AND_M2_PRIORITY_REALIGNMENT_TR.md
  - documentation/178_END_TO_END_EXPERIMENTAL_PLAN_AND_EVALUATION_PROTOCOL_EN.md

harness:
  package: lm_eval
  release: v0.4.12
  git_commit: 6d642546f4688648fced259eb3302efd36ece5af
  install_mode: dedicated_locked_environment_required
  cli: lm-eval
  model_backend: hf
  apply_chat_template: false
  system_instruction: null
  trust_remote_code: false
  seeds:
    python: 42
    numpy: 42
    torch: 42
    fewshot: 42
  project_bootstrap_samples: 10000
  project_bootstrap_seed: 42

cadence:
  dense:
    rule: every_epoch_end_including_parent_for_future_runs
    families:
      - identity_and_training_trace
      - factual_access_cheap
      - english_retention_primary
      - generation_integrity_cheap
  full:
    rule: state_entry_midpoint_endpoint
    normalized_progress:
      - 0.0
      - 0.5
      - 1.0
    families:
      - factual_access_full
      - english_capability
      - turkish_capability
      - generation_integrity_full
  historical_olmo_steps:
    dense: [0, 42, 84, 126, 168, 210, 252]
    full: [0, 126, 252]
    available_epochs: [0, 6, 12, 18, 24, 30, 36]
    limitation: missing_epoch_weights_cannot_be_reconstructed_or_imputed
  unresolved:
    - pile_10k_dense_or_full_after_runtime_qualification
    - exact_m2_steps_from_future_training_contract
    - cheap_factual_probe_registry_and_hash

standard_tasks:
  - id: wikitext
    inclusion: core
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: english_retention_primary
    cadence: dense
    fewshot: 0
    primary_metric: bits_per_byte
    reported_metrics: [word_perplexity, byte_perplexity, bits_per_byte]
    dataset: EleutherAI/wikitext_document_level
    dataset_config: wikitext-2-raw-v1
    split: test
    upstream_config_sha256: f6d1a228da486466ac91922c99cb5ff197610ec045decb2009599a16b80eaf45

  - id: pile_10k
    inclusion: core_pending_runtime
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: english_retention_broad_domain_control
    cadence: unresolved_dense_or_full
    fewshot: 0
    primary_metric: bits_per_byte
    reported_metrics: [word_perplexity, byte_perplexity, bits_per_byte]
    dataset: NeelNanda/pile-10k
    dataset_config: null
    split: train
    upstream_config_sha256: 89cf6d71c1e41414a5645c2329216e583c5bbdbc2846b6625985b713929faaad

  - id: blimp
    inclusion: core
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: english_grammar_capability
    cadence: full
    fewshot: 0
    primary_metric: acc
    aggregation: unweighted_macro_over_67_subtasks
    dataset: nyu-mll/blimp
    split: train_as_validation
    upstream_group_sha256: 967349a443540d81bf70e73ee4049d2eb70f1e4812b684384f796de6bd4ba26f
    upstream_template_sha256: c69805e3455a2904af0dac907c981331db08fd4bd6b16822113abdb74bcb528e

  - id: hellaswag
    inclusion: core
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: english_commonsense_capability
    cadence: full
    fewshot: 0
    primary_metric: acc_norm
    sensitivity_metric: acc
    dataset: Rowan/hellaswag
    split: validation
    upstream_config_sha256: e9ef8ac3fed02bf283777d946ae76cbf906152e9c92533c9794e5a9dad78d1cf

  - id: winogender_slices
    task_ids: [winogender_female, winogender_male, winogender_neutral]
    inclusion: diagnostic
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: english_coreference_and_bias_diagnostic
    cadence: full
    fewshot: 0
    primary_metric: acc
    derived_metrics: [female_minus_male_accuracy, neutral_minus_binary_mean_accuracy]
    dataset: oskarvanderwal/winogender
    split: test
    upstream_base_config_sha256: 89b9e873c28f37e0ff608eedc6ff0f4062c98eb1127bfbce588011d010bacc13

  - id: turblimp_core
    inclusion: core
    status: upstream_semantics_verified_group_yaml_duplicate_key_requires_parity_test
    role: turkish_grammar_manipulation_check
    cadence: full
    fewshot: 0
    primary_metric: acc_norm
    sensitivity_metric: acc
    aggregation: unweighted_macro_over_16_subtasks
    dataset: juletxara/turblimp
    split: train_as_test
    upstream_group_sha256: 5a0a660e69eb0da0316fcd758ec0adb7b7e857b368ce5d151a0e143afbf3d421
    upstream_template_sha256: 26e9fe58fd8fb83dd86b6669f152964167e84a5ee56ad8ef87c78e1a0c10f388

  - id: xnli_en
    inclusion: core
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: english_nli_capability
    cadence: full
    fewshot: 0
    primary_metric: acc
    dataset: xnli
    dataset_config: en
    split: validation
    upstream_config_sha256: 61e0924cddabc004f434b5b38750d6d7d3e800c79ee3a5be85fd127017b285f1

  - id: xnli_tr
    inclusion: core
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: turkish_nli_manipulation_check
    cadence: full
    fewshot: 0
    primary_metric: acc
    dataset: xnli
    dataset_config: tr
    split: validation
    upstream_config_sha256: 6d4bdaa4a21474908929cec208897dd7c689896c2112212ca0c5c9b5bad3827e

  - id: turkishmmlu
    task_ids:
      - turkishmmlu_biology
      - turkishmmlu_chemistry
      - turkishmmlu_physics
      - turkishmmlu_geography
      - turkishmmlu_philosophy
      - turkishmmlu_history
      - turkishmmlu_religion_and_ethics
      - turkishmmlu_turkish_language_and_literature
      - turkishmmlu_mathematics
    inclusion: conditional_before_freeze
    status: dataset_access_unverified
    role: turkish_knowledge_capability_secondary
    cadence: full
    fewshot: 5
    primary_metric: acc
    sensitivity_metric: acc_norm
    dataset: AYueksel/TurkishMMLU
    split: test
    subject_count: 9
    upstream_template_sha256: d8ae99801eb61484dfc8a8b83e4e07b0ced05f601fca360a31afd23e5fdbc7e2

  - id: xcopa_tr
    inclusion: reserve_secondary
    status: upstream_semantics_verified_dataset_revision_unresolved
    role: turkish_causal_commonsense_secondary
    cadence: full_if_promoted_before_freeze
    fewshot: 0
    primary_metric: acc
    dataset: xcopa
    dataset_config: tr
    split: test
    upstream_config_sha256: e95ccddfe0b3128b5a26b07f65eb0410728ce97110a98fe4cc7897ac3227358b

excluded_or_deferred:
  - id: xquad_tr
    reason: generation_format_sensitivity_and_no_incremental_core_estimand
  - id: ewok
    reason: exact_source_and_adapter_unresolved
  - id: turkish_hellaswag
    reason: no_verified_upstream_task_and_machine_translation_is_forbidden

custom_factual:
  evaluator: project_native
  primary_candidate_score: mean_answer_token_log_probability
  sensitivity_candidate_score: total_answer_token_log_probability
  tie_breaker: canonical_object_id
  directions: [en_to_en, tr_to_en, tr_to_tr]
  cells:
    forms: [form_a, form_b, form_c, form_d]
    scaffolds: [direct, qa]
  primary_outcome: top1_accuracy
  robustness:
    - relation_accuracy
    - form_accuracy
    - scaffold_accuracy
    - worst_cell_accuracy
    - robust_fact_intersection
    - same_subject_relation_swap
  uncertainty: paired_subject_bootstrap
  exact_prefix_generation: secondary_where_explicitly_defined

retention:
  english_primary: wikitext_raw_bits_per_byte_and_absolute_delta_to_parent
  english_secondary: pile_10k_raw_bits_per_byte_and_absolute_delta_to_parent
  turkish_primary: frozen_heldout_turkish_raw_bits_per_byte_and_absolute_delta_to_parent
  report_always:
    - raw_value
    - parent_value
    - absolute_delta
    - word_perplexity
    - byte_perplexity
    - perplexity_ratio_to_parent
  bpb_ratio_to_parent:
    role: optional_diagnostic_only
    reason: bits_per_byte_is_already_log_scaled
  derived_retention_score:
    formula: 100 / perplexity_ratio
    role: visualization_only
    scientific_gate: false

training_trace:
  required_for_future_runs: true
  cadence: optimizer_logs_plus_every_epoch_end
  epoch_snapshot_policy: model_only_every_epoch
  resumable_checkpoint_policy: separately_precommitted_milestones
  storage_preflight_required: true
  required_tokenization_statistics:
    - total_nonpad_tokens
    - total_supervised_tokens
    - mean_nonpad_tokens
    - p50_nonpad_tokens
    - p95_nonpad_tokens
    - padding_fraction
    - truncation_count
    - truncation_rate
  required_optimization_trace:
    - epoch
    - update
    - cumulative_examples
    - cumulative_fact_exposures
    - cumulative_supervised_tokens
    - cumulative_total_tokens
    - train_loss
    - learning_rate
    - grad_norm
    - checkpoint_sha256

pipeline:
  config_schema: configs/pipelines/eval_v1_olmo_epoch_trajectory_template.yaml
  stage_order:
    - identity_preflight
    - train_and_trace
    - dense_evaluation
    - full_evaluation
    - normalization
    - presentation_bundle
  required_outputs:
    - checkpoint_registry.parquet
    - metric_observations.parquet
    - factual_probe_results.parquet
    - trajectory_wide.csv
    - hyperparameters.csv
    - evaluation_manifest.json
    - presentation/figure_manifest.json

freeze_blockers:
  - exact_huggingface_dataset_revisions_and_local_content_manifests
  - dedicated_environment_lock_and_olmo_compatibility_smoke
  - lm_eval_ls_and_validate_evidence_for_the_final_task_set
  - canonical_wikitext_parity_and_heading_sensitivity_result
  - pile_10k_runtime_and_cadence_decision
  - turblimp_duplicate_key_result_normalization_test
  - turkishmmlu_access_inclusion_or_exclusion_decision
  - cheap_factual_panel_ids_and_hash
  - numeric_acquisition_retention_manipulation_and_noninferiority_margins
  - exact_training_contract_checkpoint_bindings
