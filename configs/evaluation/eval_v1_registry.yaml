cadence:
  dense:
    rule: every_epoch_end_including_parent_for_future_runs
    families:
      - identity_and_training_trace
      - factual_access_cheap
      - english_retention_primary
      - generation_integrity_cheap
  full:
    rule: state_entry_midpoint_endpoint
    normalized_progress:
      - 0.0
      - 0.5
      - 1.0
    families:
      - factual_access_full
      - english_capability
      - turkish_capability
      - generation_integrity_full
  historical_olmo_steps:
    dense: [0, 42, 84, 126, 168, 210, 252]
    full: [0, 126, 252]
    available_epochs: [0, 6, 12, 18, 24, 30, 36]
    limitation: missing_epoch_weights_cannot_be_reconstructed_or_imputed
  checkpoint_binding_policy:
    owner: each_future_training_contract
    rule: bind_every_epoch_to_exact_integer_update_and_checkpoint_hash_before_training
    midpoint_rule: bind_one_exact_integer_update_before_training_no_interpolation
    semantic_change: false
  dense_at_full_checkpoint: derive_cheap_rows_from_same_full_probe_scores_without_rescoring

